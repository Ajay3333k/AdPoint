name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q AdPoint_Android_AdMob_Configured.zip -d project
          sed -i 's/android.useAndroidX=false/android.useAndroidX=true/g' project/AdPoint_Android/gradle.properties

      - name: Find project files
        run: |
          find project -type f | head -50

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          cd project/AdPoint_Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdPoint-APK
          path: project/AdPoint_Android/app/build/outputs/apk/debug/*.apk
